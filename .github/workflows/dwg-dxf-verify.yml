name: DWG/DXF verification

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/dwg-dxf-verify.yml'
      - 'CMakeLists.txt'
      - 'libraries/libdxfrw/**'
      - 'librecad/src/lib/filters/**'
      - 'scripts/dwg-fast-check.sh'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/dwg-dxf-verify.yml'
      - 'CMakeLists.txt'
      - 'libraries/libdxfrw/**'
      - 'librecad/src/lib/filters/**'
      - 'scripts/dwg-fast-check.sh'
  workflow_dispatch:

jobs:
  VerifyDwgDxfFast:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install test dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -qq install qmake6 qt6-base-dev qt6-declarative-dev qt6-image-formats-plugin-pdf qt6-image-formats-plugins qt6-pdf-dev linguist-qt6
          sudo apt-get -qq install qt6-svg-dev libqt6svgwidgets6 qt6-l10n-tools qtchooser qt6-wayland qt6-wayland-dev qt6-tools-dev
          sudo apt-get -qq install libgl-dev libxcb-cursor0 libmuparser-dev libboost-dev libssl-dev libssl3
          sudo apt-get -qq install libfreetype6-dev libicu-dev pkg-config cmake ninja-build

      - name: Configure bounded DWG/DXF test lanes
        run: |
          cmake -S . -B format-tests -G Ninja \
            -DBUILD_TESTS=ON \
            -DLIBDXFRW_BUILD_DOC=OFF \
            -DLIBRECAD_REGISTER_INTEGRATION_TESTS=ON \
            -DLIBRECAD_REGISTER_FULL_TESTS=OFF \
            -DLIBRECAD_REGISTER_FORMAT_TESTS=OFF \
            -DLIBRECAD_REGISTER_CROSS_READ_SMOKE=OFF

      - name: Build bounded DWG/DXF test lanes
        run: |
          cmake --build format-tests \
            --target librecad_dwg_fast_tests librecad_dxf_fast_tests \
            -j"$(nproc)"

      - name: Run bounded DWG/DXF test lanes
        run: ctest --test-dir format-tests --output-on-failure

  VerifyDwgDxfWindows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            qt_host: windows
            qt_arch: win64_msvc2022_64
            cmake_arch: x64
            msbuild_arch: x64
            qt_modules: qt3d qt5compat qtimageformats qtshadertools
          - os: windows-11-arm
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            cmake_arch: ARM64
            msbuild_arch: arm64
            qt_modules: qt5compat qtimageformats qtshadertools
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          target: desktop
          tools-only: 'false'
          modules: ${{ matrix.qt_modules }}
          tools: tools_cmake

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: ${{ matrix.msbuild_arch }}

      - name: Install boost
        run: |
          curl -# -L -o boost.7z https://archives.boost.io/release/1.87.0/source/boost_1_87_0.7z
          7z x -o. -y boost.7z
          mv boost_1_87_0 boost
          rm boost.7z
        shell: bash

      - name: Configure bounded DWG/DXF test lanes
        run: |
          cmake.exe -S . -B generated-tests -G "Visual Studio 17 2022" -A "${{ matrix.cmake_arch }}" -DBOOST_ROOT="%CD%\boost" -DBUILD_TESTS=ON -DLIBRECAD_REGISTER_INTEGRATION_TESTS=ON -DLIBRECAD_REGISTER_FULL_TESTS=OFF -DLIBRECAD_REGISTER_FORMAT_TESTS=OFF -DLIBRECAD_REGISTER_CROSS_READ_SMOKE=OFF
        shell: cmd

      - name: Build bounded DWG/DXF test lanes
        run: |
          cmake --build generated-tests --config Release --target librecad_dwg_fast_tests librecad_dxf_fast_tests
        shell: cmd

      - name: Run bounded DWG/DXF test lanes
        run: ctest --test-dir generated-tests -C Release --output-on-failure
        shell: cmd
