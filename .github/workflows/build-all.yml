name: Continuous build
on:
  push:
    branches:
      - master
      - 2.2.1
    tags:
      - 'v*'
      - '*_rc[0-9]*'
      - '*-rc[0-9]*'
  # Run the lightweight change detector for every PR so the MSIX check is
  # always reported; expensive Windows jobs run only for package inputs.
  pull_request:
    branches:
      - 2.2.1

# A release pushes branch+tag atomically and GitHub fires two workflow runs
# (refs/heads/<branch> and refs/tags/<tag>) on the same SHA. We let both run
# to completion: which event arrives first is undocumented, so cancelling
# could lose the tag run (and with it ReleaseAssets). The branch run does
# UpdateAssets; the tag run does ReleaseAssets; they're mutually exclusive
# and don't conflict. Cost: 2x build time on release pushes only.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  DetectMsixChanges:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.msix-changes.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Detect MSIX inputs
        id: msix-changes
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(git diff --name-only HEAD^1 HEAD); then
            echo '::warning::Could not inspect the PR diff; running the MSIX check.'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif grep -Eq '^(\.github/workflows/build-all\.yml|scripts/build-msix[^/]*\.ps1|scripts/msix/|scripts/copy-vc-runtime\.ps1|scripts/build-windows\.bat|scripts/postprocess-windows/nsis-msvc\.nsi|licenses/|LICENSE$)' <<< "$files"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  BuildLinux:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install Qt5
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.*'

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -qq install \
          libgl-dev libmuparser-dev libboost-dev librsvg2-bin libfreetype6-dev libicu-dev pkg-config libfuse2
          sudo apt-get -qq install clang clang-tools
          sudo rm -rf /usr/local/lib/android

      - name: Build and analyze
        run: |
          export CC=g++
          export ANALYZE="scan-build -o out --use-cc=g++ --use-analyzer=/usr/bin/clang++ "
          ${ANALYZE}qmake -r librecad.pro CONFIG+=debug_and_release PREFIX=/usr
          ${ANALYZE}make release -j$(nproc)

      - name: Create report repository
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          cd out
          find . -mindepth 2 -type f -print -exec mv {} . \;
          git config --global user.email "github@librecad.org"
          git config --global user.name "GHA CI [bot]"
          git config --global init.defaultBranch gh-pages
          git init
          git add .
          git commit -m "latest analyzer report"

      - name: Push changes
        if: ${{ github.repository_owner == 'LibreCAD' && !startsWith(github.ref, 'refs/tags/') }}
        uses: ad-m/github-push-action@master
        with:
          repository: ${{github.repository_owner}}/static-analyzer-reports
          github_token: ${{secrets.LC_PUSH_ANALYZER_REPORT}}
          branch: gh-pages
          force: true
          directory: out

      - name: Create AppImage
        run: |
          ./CI/build-appimg.sh
          pwd
          echo  ${{github.workspace}}
          ls  ${{github.workspace}}/
          ls  ${{github.workspace}}/**.AppImage
          ls

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: linuxAssets
          path: ${{github.workspace}}/LibreCAD*.AppImage
          retention-days: 2

  BuildLinuxAarch64:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -qq install libqt5svg5 libqwt-qt5-dev imagemagick
          sudo apt-get -qq install qt5-qmake libqt5core5a libqt5gui5 libqt5widgets5 libqt5printsupport5 libqt5svg5-dev \
          libqt5pdf5 libqt5scripttools5 libqt5dbus5 libqt5charts5-dev qttools5-dev-tools \
          libgl-dev libmuparser-dev libboost-dev librsvg2-bin libfreetype6-dev libicu-dev pkg-config libfuse2 \
          qttranslations5-l10n
          sudo rm -rf /usr/local/lib/android

      - name: Build
        run: |
          /usr/lib/qt5/bin/qmake -r librecad.pro CONFIG+=debug_and_release PREFIX=/usr
          make release -j$(nproc)

      - name: Create AppImage
        run: |
          ./CI/build-appimg-aarch64.sh
          pwd
          echo  ${{github.workspace}}
          ls  ${{github.workspace}}/
          ls  ${{github.workspace}}/**.AppImage
          ls

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: linuxAarch64Assets
          path: ${{github.workspace}}/LibreCAD*.AppImage
          retention-days: 2

  BuildSnap:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Build snap
        id: snap
        uses: canonical/action-build@v1

      - name: Rename snap
        run: mv "${{ steps.snap.outputs.snap }}" "LibreCAD-$(git describe --always).snap"

      - name: Uploading snap
        uses: actions/upload-artifact@v5
        with:
          name: snapAssets
          path: ${{ github.workspace }}/LibreCAD*.snap
          retention-days: 2

  BuildMacOS:
    if: github.event_name == 'push'
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install Qt5
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.*'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'

      - name: update Qt5
        run: |
          sed -i'' -e 's:isEmpty(QMAKE_DEFAULT_LIBDIRS)|isEmpty(QMAKE_DEFAULT_INCDIRS):isEmpty("H"):' $Qt5_Dir/mkspecs/features/toolchain.prf
          sed -i'' -e 's:error("failed to parse default search paths from compiler output"):LIBRECAD_SDK=:' $Qt5_Dir/mkspecs/features/toolchain.prf

      - name: Install dependencies
        run: |
          rm -f /usr/local/bin/2to3
          brew install boost

      - name: Kill XProtectBehaviorService
        run: |
          echo Killing XProtect.
          sudo pkill -9 XProtect >/dev/null || true

      - name: Build and packaging
        run: |
          scripts/build-osx.sh -cert=-
          mv LibreCAD.dmg LibreCAD-`git describe --always`.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: macOSAssets
          path: ${{github.workspace}}/LibreCAD*.dmg
          retention-days: 2

  BuildMacOSArm64:
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install dependencies
        run: |
          rm -f /usr/local/bin/2to3
          brew install boost qt@5
          echo "/opt/homebrew/opt/qt@5/bin" >> $GITHUB_PATH

      - name: update Qt5
        run: |
          sed -i'' -e 's:isEmpty(QMAKE_DEFAULT_LIBDIRS)|isEmpty(QMAKE_DEFAULT_INCDIRS):isEmpty("H"):' /opt/homebrew/opt/qt@5/mkspecs/features/toolchain.prf
          sed -i'' -e 's:error("failed to parse default search paths from compiler output"):LIBRECAD_SDK=:' /opt/homebrew/opt/qt@5/mkspecs/features/toolchain.prf

      - name: Kill XProtectBehaviorService
        run: |
          echo Killing XProtect.
          sudo pkill -9 XProtect >/dev/null || true

      - name: Build and packaging
        env:
          QMAKE_OPTS: QMAKE_APPLE_DEVICE_ARCHS=arm64
        run: |
          scripts/build-osx.sh -cert=-
          mv LibreCAD.dmg LibreCAD-`git describe --always`-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: macOSArm64Assets
          path: ${{github.workspace}}/LibreCAD*.dmg
          retention-days: 2

  BuildWindows:
    needs: [DetectMsixChanges]
    if: github.event_name == 'push' || needs.DetectMsixChanges.outputs.changed == 'true'
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup MSVC developer environment (32-bit)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install Qt-5.15 (MSVC 2019 32-bit)
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win32_msvc2019'
          dir: '..'
          install-deps: 'true'
          cache: 'false'
          setup-python: 'true'
          set-env: 'true'
          aqtversion: '==3.1.*'
          py7zrversion: '==0.20.*'
          extra: '--external 7z'

      - name: Install boost
        shell: bash
        run: |
          curl -# -L -o boost.7z https://archives.boost.io/release/1.87.0/source/boost_1_87_0.7z
          7z x -o. -y boost.7z
          mv boost_1_87_0 ../boost
          rm boost.7z

      - name: Configure for MSVC
        shell: cmd
        run: |
          copy CI\custom-win.pri custom.pri
          copy CI\custom-win.nsh scripts\postprocess-windows\custom.nsh

      - name: Build and package with script (MSVC-compatible)
        shell: cmd
        run: |
          pushd "${{github.workspace}}\scripts"
          build-windows.bat

      - name: Rename installer
        shell: bash
        run: |
          mv generated/LibreCAD-*.exe LibreCAD-`git describe --always`-msvc.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: win32Assets
          path: ${{github.workspace}}/LibreCAD*.exe
          retention-days: 2

  BuildWindows64:
    needs: [DetectMsixChanges]
    if: github.event_name == 'push' || needs.DetectMsixChanges.outputs.changed == 'true'
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Test installer version parsing
        shell: powershell
        run: ./scripts/tests/installer-version-tests.ps1

      - name: Setup MSVC developer environment (64-bit)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt-5.15 (MSVC 2019 64-bit)
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: '..'
          install-deps: 'true'
          cache: 'false'
          setup-python: 'true'
          set-env: 'true'
          aqtversion: '==3.1.*'
          py7zrversion: '==0.20.*'
          extra: '--external 7z'

      - name: Install boost
        shell: bash
        run: |
          curl -# -L -o boost.7z https://archives.boost.io/release/1.87.0/source/boost_1_87_0.7z
          7z x -o. -y boost.7z
          mv boost_1_87_0 ../boost
          rm boost.7z

      - name: Configure for MSVC
        shell: cmd
        run: |
          copy CI\custom-win.pri custom.pri
          copy CI\custom-win-x64.nsh scripts\postprocess-windows\custom.nsh

      - name: Build and package with script (MSVC-compatible)
        shell: cmd
        run: |
          pushd "${{github.workspace}}\scripts"
          build-windows.bat

      - name: Rename installer
        shell: bash
        run: |
          mv generated/LibreCAD-*.exe LibreCAD-`git describe --always`-win64-msvc.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: win64Assets
          path: ${{github.workspace}}/LibreCAD*.exe
          retention-days: 2

      # The MSIX for the stable LibreCAD product of the Microsoft Store, made from
      # the folder the installer was built from: docs/development/msix-store.md.
      - name: Stage the Visual C++ runtime for the MSIX
        id: stage-msix
        # After the installer, which stays as it was built.  A failure here must
        # not hold back the installers of a push: PackageWindowsMsix then fails
        # for want of the package instead.
        continue-on-error: ${{ github.event_name == 'push' }}
        shell: pwsh
        run: |
          & scripts\copy-vc-runtime.ps1 -Architecture AMD64 -Destination windows

      - name: Package MSIX
        id: package-msix
        if: ${{ !cancelled() && steps.stage-msix.outcome == 'success' }}
        # It takes under a minute; the limit turns a hang into a failure, which
        # continue-on-error absorbs on a push, not a cancellation.
        continue-on-error: ${{ github.event_name == 'push' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          # The Store reserves the revision component, so it stays 0; the run
          # number, which counts the runs of this workflow on every branch, keeps
          # the build component increasing.
          $match = Select-String -Path librecad\src\src.pro -Pattern '^LC_VERSION="([0-9]+)\.([0-9]+)\.' |
            Select-Object -First 1
          if (-not $match) { throw 'LC_VERSION was not found in librecad\src\src.pro.' }
          $packageVersion = "$($match.Matches[0].Groups[1].Value).$($match.Matches[0].Groups[2].Value).${{ github.run_number }}.0"

          # Repository variables carry the real identity of the stable Store
          # product; the fallbacks below are placeholders that the submission
          # workflow refuses.
          $identity = '${{ vars.MICROSOFT_STORE_IDENTITY_NAME }}'
          if (-not $identity) { $identity = 'LibreCAD.Development' }
          $publisher = '${{ vars.MICROSOFT_STORE_PUBLISHER }}'
          if (-not $publisher) { $publisher = 'CN=LibreCAD Development' }
          $publisherDisplayName = '${{ vars.MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME }}'
          if (-not $publisherDisplayName) { $publisherDisplayName = 'LibreCAD' }

          & scripts\build-msix.ps1 `
            -Architecture x64 `
            -InputDirectory windows `
            -BoostDirectory ..\boost `
            -OutputDirectory msix-output `
            -PackageVersion $packageVersion `
            -IdentityName $identity `
            -Publisher $publisher `
            -PublisherDisplayName $publisherDisplayName `
            -PackageName LibreCAD

      - name: Show MakeAppx output
        # Package MSIX prints MakeAppx's file list only when MakeAppx fails;
        # this also shows where it stopped if the step hit its time limit.
        if: ${{ !cancelled() && steps.package-msix.outcome == 'failure' }}
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ChildItem msix-output -Filter 'makeappx-*.log' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "== $($_.Name)"; Get-Content -LiteralPath $_.FullName -Tail 40 }

      - name: Upload MSIX artifact
        if: steps.package-msix.outcome == 'success'
        continue-on-error: ${{ github.event_name == 'push' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@v5
        with:
          name: win64Msix
          path: msix-output/*.msix*
          if-no-files-found: error
          retention-days: 2

  PackageWindowsMsix:
    needs: [DetectMsixChanges, BuildWindows64]
    if: github.event_name == 'push' || needs.DetectMsixChanges.outputs.changed == 'true'
    # The bundle holds the x64 package only: 2.2.1 has no arm64 build.
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          ref: ${{ github.ref }}

      - name: Download x64 package
        uses: actions/download-artifact@v6
        with:
          name: win64Msix
          path: msix-x64

      - name: Build MSIX bundle
        shell: pwsh
        run: |
          # -Filter '*.msix' also matches '*.msixbundle' under 8.3 wildcard
          # rules, so compare the extension instead.
          $x64 = Get-ChildItem msix-x64 -File | Where-Object { $_.Extension -eq '.msix' } | Select-Object -First 1
          if (-not $x64) { throw 'No x64 .msix was downloaded.' }

          $match = Select-String -Path librecad\src\src.pro -Pattern '^LC_VERSION="([0-9]+)\.([0-9]+)\.' |
            Select-Object -First 1
          if (-not $match) { throw 'LC_VERSION was not found in librecad\src\src.pro.' }
          $packageVersion = "$($match.Matches[0].Groups[1].Value).$($match.Matches[0].Groups[2].Value).${{ github.run_number }}.0"

          & scripts\build-msix-bundle.ps1 `
            -X64Package $x64.FullName `
            -OutputDirectory msix-bundle `
            -PackageVersion $packageVersion `
            -PackageName LibreCAD

      - name: Smoke test the package
        # A Qt error dialog would otherwise hold the runner until the job limit.
        timeout-minutes: 15
        run: |
          # Registering an unpacked layout exercises the manifest, identity and
          # entry point without a certificate.  Developer Mode is already on for
          # every GitHub Windows image.
          $x64 = Get-ChildItem msix-x64 -File | Where-Object { $_.Extension -eq '.msix' } | Select-Object -First 1
          $staged = Join-Path $env:RUNNER_TEMP 'msix-register'
          if (Test-Path $staged) { Remove-Item $staged -Recurse -Force }
          # Expand-Archive only accepts a .zip extension; the ZIP API does not care.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($x64.FullName, $staged)
          [xml]$manifest = Get-Content -LiteralPath (Join-Path $staged 'AppxManifest.xml') -Raw
          $identityName = $manifest.Package.Identity.Name
          Add-AppxPackage -Register (Join-Path $staged 'AppxManifest.xml')
          $installed = Get-AppxPackage -Name $identityName
          if (-not $installed) { throw "The package $identityName did not register." }
          Write-Host "Registered $($installed.PackageFullName)"

          # Run the packaged program once, as a converter.  It is a GUI
          # program, so wait for it explicitly.  This also checks that the
          # package holds every DLL it needs.  Without a console window Qt
          # logs to the debugger, so it is told to log to the redirected
          # stderr instead.
          $sample = Get-Item -LiteralPath (Join-Path $staged 'resources\library\misc\screw.dxf')
          $png = Join-Path $env:RUNNER_TEMP 'msix-smoke.png'
          $errors = Join-Path $env:RUNNER_TEMP 'msix-smoke-stderr.txt'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $converter = Start-Process -FilePath (Join-Path $staged 'LibreCAD.exe') `
            -ArgumentList @('dxf2png', '-o', "`"$png`"", "`"$($sample.FullName)`"") `
            -NoNewWindow -Wait -PassThru -RedirectStandardError $errors
          if (Test-Path $errors) { Get-Content $errors }
          if ($converter.ExitCode -ne 0) { throw "LibreCAD.exe dxf2png exited with $($converter.ExitCode)." }
          if (-not (Test-Path $png)) { throw "LibreCAD.exe dxf2png wrote no PNG for $($sample.Name)." }
          if (-not ((Test-Path -LiteralPath $errors) -and (Select-String -LiteralPath $errors -SimpleMatch 'Done' -Quiet))) {
            throw "LibreCAD.exe dxf2png wrote nothing to the redirected stderr; Qt's messages went elsewhere."
          }
          Write-Host "Converted $($sample.Name) to PNG"

          Remove-AppxPackage -Package $installed.PackageFullName
        # Windows PowerShell, not pwsh: the Appx module is built on WinRT and
        # fails to load in PowerShell 7 with 0x80131539.
        shell: powershell

      - name: Windows App Certification Kit
        run: |
          # Not contractually present on hosted images, so skip rather than fail.
          $appcert = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\App Certification Kit\appcert.exe'
          if (-not (Test-Path -LiteralPath $appcert)) {
            Write-Host 'App Certification Kit is not installed on this runner; skipping.'
            exit 0
          }
          $bundle = Get-ChildItem msix-bundle -File |
            Where-Object { $_.Extension -eq '.msixbundle' } | Select-Object -First 1
          $report = Join-Path $env:RUNNER_TEMP 'wack-report.xml'
          & $appcert reset
          & $appcert test -appxpackagepath $bundle.FullName -reportoutputpath $report
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::App Certification Kit exited with $LASTEXITCODE"
          }
          if (Test-Path -LiteralPath $report) {
            # The overall result is an attribute of the root; each test's
            # result is the text of its RESULT element.
            [xml]$xml = Get-Content -LiteralPath $report -Raw
            $failed = @($xml.SelectNodes('//TEST[normalize-space(RESULT)="FAIL"]'))
            foreach ($test in $failed) {
              Write-Host "::warning::App Certification Kit test failed: $($test.NAME) (optional: $($test.OPTIONAL))"
            }
            Write-Host "App Certification Kit: overall $($xml.REPORT.OVERALL_RESULT), $($failed.Count) failing test(s)."
            New-Item -ItemType Directory -Force -Path wack | Out-Null
            Copy-Item -LiteralPath $report -Destination wack\wack-report.xml
          }
        shell: pwsh
        continue-on-error: true

      - name: Upload App Certification Kit report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: winMsixWackReport
          path: wack/wack-report.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload MSIX bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: winMsixBundle
          # The .msixupload holds the .msixbundle; uploading both would store
          # the same package twice.
          path: msix-bundle/*.msixupload*
          if-no-files-found: error
          retention-days: 30

  UpdateAssets:
    if: ${{ github.event_name == 'push' && github.repository_owner == 'LibreCAD' && !startsWith(github.ref, 'refs/tags/') }}
    needs: [BuildLinux, BuildLinuxAarch64, BuildMacOS, BuildMacOSArm64, BuildWindows, BuildWindows64, BuildSnap]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Fetch artifacts
        uses: actions/download-artifact@v6

      - name: Upload latest pre-release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{secrets.GITHUB_TOKEN}}"
          automatic_release_tag: "2.2.1-latest"
          prerelease: true
          draft: false
          title: "Release Candidate"
          files: |
            linuxAssets/LibreCAD*.AppImage
            linuxAarch64Assets/LibreCAD*.AppImage
            macOSAssets/LibreCAD*.dmg
            macOSArm64Assets/LibreCAD*.dmg
            win*Assets/LibreCAD*.exe
            snapAssets/LibreCAD*.snap
            LICENSE

  ReleaseAssets:
    if: ${{ github.event_name == 'push' && github.repository_owner == 'LibreCAD' && startsWith(github.ref, 'refs/tags/') }}
    needs: [BuildLinux, BuildLinuxAarch64, BuildMacOS, BuildMacOSArm64, BuildWindows, BuildWindows64, BuildSnap]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Fetch artifacts
        uses: actions/download-artifact@v6

      - name: Determine release kind
        id: relkind
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *_rc[0-9]* || "$tag" == *-rc[0-9]* || "$tag" == *_alpha[0-9]* || "$tag" == *-alpha[0-9]* || "$tag" == *_beta[0-9]* || "$tag" == *-beta[0-9]* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # If the script already created the release with notes, leave those
          # alone; only auto-generate when CI is the one creating the release.
          release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -s --arg tag "$tag" '[.[][] | select(.tag_name == $tag)][0]')
          if [[ "$release" != null ]]; then
            echo "generate_notes=false" >> "$GITHUB_OUTPUT"
            echo "draft=$(jq -r '.draft' <<< "$release")" >> "$GITHUB_OUTPUT"
          else
            echo "generate_notes=true" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.relkind.outputs.tag }}
          name: LibreCAD ${{ steps.relkind.outputs.tag }}
          draft: ${{ steps.relkind.outputs.draft }}
          prerelease: ${{ steps.relkind.outputs.prerelease }}
          generate_release_notes: ${{ steps.relkind.outputs.generate_notes }}
          fail_on_unmatched_files: true
          files: |
            linuxAssets/LibreCAD*.AppImage
            linuxAarch64Assets/LibreCAD*.AppImage
            macOSAssets/LibreCAD*.dmg
            macOSArm64Assets/LibreCAD*.dmg
            win32Assets/LibreCAD*.exe
            win64Assets/LibreCAD*.exe
            snapAssets/LibreCAD*.snap
            LICENSE
