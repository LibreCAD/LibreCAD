name: Pixi Builds
on: [workflow_dispatch, push, pull_request]

# A newer push to the same branch or pull request supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_with_pixi:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]

    steps:
    - uses: actions/checkout@v6
      name: Checkout
      with:
        # Catch2, for the one lane that builds the tests (the last step)
        submodules: ${{ matrix.os == 'ubuntu-latest' }}

    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.41.4
        cache: true
    - name: Build and check plugin and resource installation
      run: pixi run check-resource-install

    # No other job builds librecad_tests, which is not part of the default build. The Linux
    # environments of pixi.lock pair a recent GCC with conda-forge's glibc 2.17 sysroot, an
    # older C library than a developer's machine has: test code that compiles on macOS, on
    # Windows and on a current distribution can still fail to compile there (#3035). The tests
    # are built in the build directory of the step above, where the application library they
    # link is already compiled. They are not run.
    - name: Build the test executable
      if: matrix.os == 'ubuntu-latest'
      run: pixi run build-tests
