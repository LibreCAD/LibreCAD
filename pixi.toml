[project]
authors = [""]
channels = ["conda-forge"]
description = "LibreCAD is a 2D CAD drawing tool."
name = "LibreCAD"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
version = "2.2.2"

[tasks]
configure = { cmd = [ "cmake", "-G", "Ninja", "-B", "build",
                      "-D", "CMAKE_BUILD_TYPE='Release'",
                      "-D", "CMAKE_INSTALL_PREFIX:FILEPATH=$CONDA_PREFIX",
                      "-D", "QT_HOST_PATH=$CONDA_PREFIX"]}
build = {cmd = ["ninja", "-C", "build", "install"], depends-on=["configure"]}
check-plugin-install = {cmd = ["cmake", "-D", "LIBRECAD_BUILD_DIR=build",
                              "-P", "scripts/check-plugin-install.cmake"], depends-on=["build"]}
check-resource-install = {cmd = ["cmake", "-D", "LIBRECAD_BUILD_DIR=build",
                                "-P", "scripts/check-resource-install.cmake"], depends-on=["check-plugin-install"]}
# The test executable is not part of the default build. These two build it, without running it,
# in the same directory: it links the application library, so once "build" has run only the tests
# themselves are compiled. Catch2 is a submodule: git submodule update --init externals/Catch2
configure-tests = {cmd = ["cmake", "-B", "build", "-D", "BUILD_TESTS=ON"], depends-on=["configure"]}
# -k 0: go on after a file fails, so that one run names every file that does not compile
build-tests = {cmd = ["ninja", "-C", "build", "-k", "0", "librecad_tests"], depends-on=["configure-tests"]}

[dependencies]
qt6-main = ">=6.8.1,<7"
libboost-devel = ">=1.87.0,<2"
freetype = ">=2.12.1,<3"
compilers = ">=1.8.0,<2"
ninja = ">=1.12.1,<2"
cmake = ">=3.31.4,<4"

[target.linux-64.dependencies]
libgl-devel = "*"

[target.linux-aarch64.dependencies]
libgl-devel = "*"
